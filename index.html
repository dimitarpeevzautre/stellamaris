<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--app-head-->
  <meta name="author" content="Stella Maris Kennel" />
  <meta name="geo.region" content="BG-22" />
  <meta name="geo.placename" content="Sofia, Bulgaria" />

  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Icons: generated from public/favicon.svg by scripts/generate-icons.mjs -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#1e3a8a" />

  <!-- Google tag, Consent Mode v2 (basic): everything is denied by default and gtag.js is
       NOT loaded here. utils/analytics.ts injects it only after the visitor accepts cookies. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });
  </script>

  <!-- Open Graph / Twitter (the per-page tags, incl. og:image and its alt, come from seo.ts) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stella Maris Kennel" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured data (JSON-LD) is added per page by scripts/prerender.mjs (see structuredData.ts). -->

</head>

<body class="bg-stella-cream text-stella-dark antialiased">
  <div id="root"><!--app-html--></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
